<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Parking Training - Toyota CHR 2021</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Car Parking Training Simulator</h1>
            <p>Toyota C-HR 2021 HEV - Practice precise parking maneuvers</p>
        </header>

        <div class="main-content">
            <div class="game-area">
                <canvas id="gameCanvas"></canvas>
                <div id="collision-warning" class="warning hidden">COLLISION!</div>
            </div>

            <div class="controls-panel">
                <div class="scenario-selector">
                    <h2>Select Scenario</h2>
                    <button class="scenario-btn active" data-scenario="1">
                        <span class="scenario-number">1</span>
                        <span class="scenario-name">Street to Underground</span>
                        <span class="scenario-desc">90° right turn, 4.5m street to 2.85m ramp</span>
                    </button>
                    <button class="scenario-btn" data-scenario="2">
                        <span class="scenario-number">2</span>
                        <span class="scenario-name">Hall to Parking Box</span>
                        <span class="scenario-desc">2.85m ramp, turn right, 2.14m gate</span>
                    </button>
                    <button class="scenario-btn" data-scenario="3">
                        <span class="scenario-number">3</span>
                        <span class="scenario-name">Exit Parking Box</span>
                        <span class="scenario-desc">Exit box and navigate to 2.85m ramp</span>
                    </button>
                    <button class="scenario-btn" data-scenario="4">
                        <span class="scenario-number">4</span>
                        <span class="scenario-name">Parallel Parking</span>
                        <span class="scenario-desc">Park between two cars, 6.5m space</span>
                    </button>
                    <button class="scenario-btn" data-scenario="5">
                        <span class="scenario-number">5</span>
                        <span class="scenario-name">Perpendicular Parking</span>
                        <span class="scenario-desc">Park straight into 90° space</span>
                    </button>
                    <button class="scenario-btn" data-scenario="6">
                        <span class="scenario-number">6</span>
                        <span class="scenario-name">Long Underground Ramp</span>
                        <span class="scenario-desc">2.85m ramp, 12m descent, 90° turn</span>
                    </button>
                    <button class="scenario-btn" data-scenario="7">
                        <span class="scenario-number">7</span>
                        <span class="scenario-name">Angle Parking (60°)</span>
                        <span class="scenario-desc">Park into angled space, easier entry</span>
                    </button>
                </div>

                <div class="controls-info">
                    <h3>Controls</h3>
                    <div class="control-item">
                        <span class="key">↑</span>
                        <span class="action">Forward</span>
                    </div>
                    <div class="control-item">
                        <span class="key">↓</span>
                        <span class="action">Reverse</span>
                    </div>
                    <div class="control-item">
                        <span class="key">← →</span>
                        <span class="action">Steer</span>
                    </div>
                    <div class="control-item">
                        <span class="key">Space</span>
                        <span class="action">Brake</span>
                    </div>
                    <div class="control-item">
                        <span class="key">R</span>
                        <span class="action">Reset</span>
                    </div>
                </div>

                <div class="car-info">
                    <h3>Vehicle Status</h3>
                    <div class="info-row">
                        <span class="label">Speed:</span>
                        <span class="value" id="speed-value">0.0 km/h</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Gear:</span>
                        <span class="value" id="gear-value">N</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Steering:</span>
                        <span class="value" id="steering-value">0°</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Position:</span>
                        <span class="value" id="position-value">X: 0.0m Y: 0.0m</span>
                    </div>
                </div>

                <button id="reset-btn" class="reset-btn">Reset Position</button>
            </div>
        </div>
    </div>

    <script src="car.js"></script>
    <script src="scenarios.js"></script>
    <script src="renderer.js"></script>
    <script src="game.js"></script>
</body>
</html>
